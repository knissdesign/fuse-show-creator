<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuse Show Creator</title>
<style>
  :root {
    --bg:      #f2f1ee;
    --card:    #ffffff;
    --card2:   #f7f6f3;
    --hdr:     #1e1e22;
    --border:  #dddbd6;
    --accent:  #1e1e22;
    --accent2: #3a6bbf;
    --text:    #1a1a1e;
    --dim:     #888580;
    --danger:  #c0392b;
    --warn:    #b7770d;
    --ok:      #2e7d32;
    --err-bg:  #fff0ee;
    --err-bd:  #e8a09a;
    --serif:   Georgia, 'Times New Roman', serif;
    --mono:    'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    height: 100%;
    overflow: hidden;
    user-select: none;
  }

  /* ── Header ───────────────────────────────── */
  header {
    background: var(--hdr);
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    flex-shrink: 0;
  }
  header img { height: 42px; width: auto; display: block; }
  header .subtitle {
    color: #aaaaaa;
    font-weight: bold;
    font-size: 16px;
  }
  #version-badge {
    margin-left: auto;
    font-size: 10px;
    color: #9a9997;
    font-family: var(--mono);
    letter-spacing: 0.04em;
  }

  /* ── Layout ───────────────────────────────── */
  main {
    padding: 12px 20px 20px;
    height: calc(100% - 64px);
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.08em;
    color: var(--dim);
    margin: 0 0 4px 2px;
    text-transform: uppercase;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
  }

  /* ── Show details ─────────────────────────── */
  .fields {
    display: grid;
    grid-template-columns: 2fr 3fr 1fr;
    gap: 10px;
  }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--dim);
    margin-bottom: 3px;
  }
  .field input {
    width: 100%;
    height: 34px;
    padding: 0 10px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    user-select: text;
  }
  .field input:focus { border-color: var(--accent2); }

  /* ── Selects ──────────────────────────────── */
  select {
    height: 34px;
    padding: 0 8px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%23888580'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 26px;
  }
  select:focus { border-color: var(--accent2); }
  .field select { width: 100%; }
  .full-select { width: 100%; }

  /* ── Show Options rows ────────────────────── */
  .opt-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 34px;
  }
  .opt-row + .opt-row { margin-top: 10px; }
  .opt-label { width: 154px; font-size: 11px; color: var(--dim); flex-shrink: 0; }
  .opt-row select { width: 220px; }
  .checkbox {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  .checkbox input {
    width: 16px; height: 16px;
    accent-color: var(--accent2);
    cursor: pointer;
  }

  .preview {
    margin-top: 10px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .preview .lbl { font-size: 11px; color: var(--dim); }
  .preview .val {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: bold;
    color: var(--accent);
  }

  /* ── Similar shows ────────────────────────── */
  #similar {
    height: 132px;
    overflow-y: auto;
  }
  #similar .placeholder,
  #similar .none {
    font-size: 11px;
    padding: 8px 2px;
  }
  #similar .placeholder { color: var(--dim); }
  #similar .none { color: var(--ok); }
  .simrow {
    display: flex;
    align-items: center;
    padding: 4px 2px;
    font-family: var(--mono);
    font-size: 12px;
  }
  .simrow + .simrow { border-top: 1px solid var(--border); }
  .simrow .dot { width: 16px; font-size: 9px; }
  .simrow .name { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .simrow .pct  { width: 60px; text-align: right; font-weight: bold; font-size: 10px; }

  /* ── Folder rows ──────────────────────────── */
  .frow {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .frow:last-child { margin-bottom: 0; }
  .frow .flabel { width: 154px; font-size: 11px; color: var(--dim); flex-shrink: 0; }
  .frow input {
    flex: 1;
    height: 32px;
    padding: 0 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    user-select: text;
  }
  .frow input.invalid { background: var(--err-bg); border-color: var(--err-bd); }
  .btn-small {
    height: 32px;
    padding: 0 14px;
    font-family: var(--serif);
    font-size: 11px;
    color: var(--accent2);
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn-small:hover { background: #eceae5; }

  /* ── Progress ─────────────────────────────── */
  #status { font-size: 11px; color: var(--dim); }

  /* ── Main button ──────────────────────────── */
  .btn-primary {
    width: 100%;
    height: 44px;
    margin-top: 2px;
    font-family: var(--serif);
    font-size: 14px;
    font-weight: bold;
    color: #ffffff;
    background: var(--hdr);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-primary:hover:not(:disabled) { background: #333338; }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }

  /* ── Success overlay ──────────────────────── */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(20,20,24,0.45);
    display: none;
    align-items: center;
    justify-content: center;
  }
  #overlay.show { display: flex; }
  .dialog {
    background: var(--bg);
    border-radius: 12px;
    padding: 28px 32px 26px;
    width: 460px;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .dialog .check { font-size: 40px; color: var(--ok); font-weight: bold; line-height: 1; }
  .dialog .dname {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: bold;
    color: var(--accent);
    margin: 10px 0 2px;
    word-break: break-word;
  }
  .dialog .created { font-size: 15px; margin-bottom: 10px; }
  .dialog .counts { font-size: 11px; color: var(--dim); margin-bottom: 18px; }

  /* ── Error overlay ────────────────────────── */
  .dialog .err-title { font-size: 16px; font-weight: bold; color: var(--danger); margin-bottom: 8px; }
  .dialog .err-body  { font-size: 12px; color: var(--text); text-align: left; white-space: pre-wrap; max-height: 200px; overflow:auto; margin-bottom: 16px; font-family: var(--mono); }

</style>
</head>

    <span class="subtitle">Show Creator</span>
    <span id="version-badge"></span>
  </header>

  <main>
    <!-- Show details -->
    <div>
      <div class="section-label">Show Details</div>
      <div class="card">
        <div class="fields">
          <div class="field">
            <label for="artist">Artist / Client</label>
            <input id="artist" type="text" autocomplete="off" spellcheck="false">
          </div>
          <div class="field">
            <label for="desc">Show Description</label>
            <input id="desc" type="text" autocomplete="off" spellcheck="false">
          </div>
          <div class="field">
            <label for="year">Year</label>
            <select id="year"></select>
          </div>
        </div>
        <div class="preview">
          <span class="lbl">Folder name:</span>
          <span class="val" id="preview">—</span>
        </div>
      </div>
    </div>

    <!-- Similar shows -->
    <div>
      <div class="section-label">Existing Similar Shows</div>
      <div class="card">
        <div id="similar">
          <div class="placeholder">Start typing show details to check for similar existing shows…</div>
        </div>
      </div>
    </div>

    <!-- Show Options -->
    <div>
      <div class="section-label">Show Options</div>
      <div class="card">
        <div class="opt-row">
          <label class="checkbox">
            <input type="checkbox" id="shortcut">
            <span>Create show shortcut</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Folders -->
    <div>
      <div class="section-label">Folders</div>
      <div class="card">
        <div class="frow">
          <span class="flabel">Template Folder</span>
          <input id="src" type="text" spellcheck="false" value="Locating template folder…">
          <button class="btn-small" onclick="pickFolder('src')">Browse</button>
        </div>
        <div class="frow">
          <span class="flabel">Active Show Directory</span>
          <input id="dest" type="text" spellcheck="false" value="Locating active show directory…">
          <button class="btn-small" onclick="pickFolder('dest')">Browse</button>
        </div>
        <div class="frow" id="shortcutRow" style="display:none">
          <span class="flabel">Shortcut Folder</span>
          <input id="shortcut_dir" type="text" spellcheck="false" placeholder="Choose a folder for the show shortcut">
          <button class="btn-small" onclick="pickFolder('shortcut_dir')">Browse</button>
        </div>
      </div>
    </div>

    <button class="btn-primary" id="run" onclick="createShow()">Create Show Folder</button>
  </main>

  <!-- Success / error overlay -->
  <div id="overlay">
    <div class="dialog" id="dialog"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  let similarResults = [];
  let simTimer = null;
  let apiReady = false;

  // pywebview signals readiness via this event
  window.addEventListener('pywebviewready', () => {
    apiReady = true;
    loadInitial();
  });

  function api() { return window.pywebview.api; }

  // Populate the Year dropdown immediately from JS (current year, -1 .. +2),
  // defaulting to the current year. Not persisted — always defaults to "now".
  function populateYears() {
    const cur = new Date().getFullYear();
    const years = [cur - 1, cur, cur + 1, cur + 2];
    const sel = $('year');
    sel.innerHTML = '';
    years.forEach(y => {
      const o = document.createElement('option');
      o.value = String(y);
      o.textContent = String(y);
      if (y === cur) o.selected = true;
      sel.appendChild(o);
    });
  }
  populateYears();

  async function loadInitial() {
    try {
      const s = await api().initial_state();
      $('src').value  = s.src  || '';
      $('dest').value = s.dest || '';
      $('src').classList.toggle('invalid',  !s.src_ok);
      $('dest').classList.toggle('invalid', !s.dest_ok);
      $('shortcut').checked = !!s.make_shortcut;
      $('shortcut_dir').value = s.shortcut_dir || '';
      $('shortcut_dir').classList.toggle('invalid', s.make_shortcut && !s.shortcut_ok);
      updateShortcutRow();
      refreshSimilar();
      if (s.version) $('version-badge').textContent = `v${s.version}`;
    } catch (e) { console.error(e); }
  }

  // Persist template dir, active dir, CAD app, and shortcut settings.
  function saveSettings() {
    if (!apiReady) return;
    try {
      api().save_settings({
        src:  $('src').value.trim(),
        dest: $('dest').value.trim(),
        make_shortcut: $('shortcut').checked,
        shortcut_dir:  $('shortcut_dir').value.trim(),
      });
    } catch (e) { console.error(e); }
  }

  // Show/hide the Shortcut Folder row based on the checkbox.
  function updateShortcutRow() {
    $('shortcutRow').style.display = $('shortcut').checked ? '' : 'none';
  }

  function showName() {
    const a = $('artist').value.trim();
    const d = $('desc').value.trim();
    const y = $('year').value.trim();
    return (a || d || y) ? [a, d, y].filter(Boolean).join(' ') : '';
  }

  function onFieldChange() {
    const n = showName();
    $('preview').textContent = n || '—';
    if (simTimer) clearTimeout(simTimer);
    simTimer = setTimeout(refreshSimilar, 350);
  }
  ['artist', 'desc'].forEach(id => $(id).addEventListener('input', onFieldChange));
  $('year').addEventListener('change', onFieldChange);

  // Persist settings (debounced for typing) when folders or CAD app change.
  let saveTimer = null;
  function queueSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saveSettings, 500);
  }

  $('shortcut').addEventListener('change', () => {
    updateShortcutRow();
    saveSettings();
  });
  $('shortcut_dir').addEventListener('input', () => {
    $('shortcut_dir').classList.remove('invalid');
    queueSave();
  });

  $('dest').addEventListener('input', () => {
    $('dest').classList.remove('invalid');
    queueSave();
    if (simTimer) clearTimeout(simTimer);
    simTimer = setTimeout(refreshSimilar, 350);
  });
  $('src').addEventListener('input', () => {
    $('src').classList.remove('invalid');
    queueSave();
  });

  async function refreshSimilar() {
    if (!apiReady) return;
    const name = showName();
    const dest = $('dest').value.trim();
    const box = $('similar');
    if (!name) {
      similarResults = [];
      box.innerHTML = '<div class="placeholder">Start typing show details to check for similar existing shows…</div>';
      return;
    }
    try {
      const res = await api().find_similar(name, dest);  // [[name, score], ...]
      similarResults = res || [];
      renderSimilar();
    } catch (e) { console.error(e); }
  }

  function colorFor(pct) {
    if (pct > 80) return 'var(--danger)';
    if (pct > 65) return 'var(--warn)';
    return 'var(--accent2)';
  }

  function renderSimilar() {
    const box = $('similar');
    if (!similarResults.length) {
      box.innerHTML = '<div class="none">✓&nbsp; No similar shows found — this name looks unique.</div>';
      return;
    }
    box.innerHTML = '';
    similarResults.forEach(([folder, score]) => {
      const pct = Math.round(score * 100);
      const c = colorFor(pct);
      const row = document.createElement('div');
      row.className = 'simrow';
      row.innerHTML =
        `<span class="dot" style="color:${c}">●</span>` +
        `<span class="name"></span>` +
        `<span class="pct" style="color:${c}">${pct}% match</span>`;
      row.querySelector('.name').textContent = folder;
      box.appendChild(row);
    });
  }

  async function pickFolder(which) {
    if (!apiReady) return;
    try {
      const path = await api().pick_folder();
      if (path) {
        $(which).value = path;
        const ok = await api().check_path(path);
        $(which).classList.toggle('invalid', !ok);
        saveSettings();
        if (which === 'dest') refreshSimilar();
      }
    } catch (e) { console.error(e); }
  }

  function setProgress(frac) { }
  function setStatus(msg)    { }

  // Called from Python during the copy
  window.onProgress = (done, total) => {
    setProgress(total ? done / total : 1);
    setStatus(`Copying ${done} / ${total} items…`);
  };
  window.onComplete = (showNameStr, destShow, count, renamed, shortcutNote) => {
    setProgress(1);
    setStatus(`✓  "${showNameStr}" created successfully.`);
    $('run').disabled = false;
    $('run').textContent = 'Create Show Folder';
    saveSettings();
    showSuccess(showNameStr, destShow, count, renamed, shortcutNote || '');
  };
  window.onError = (msg) => {
    $('run').disabled = false;
    $('run').textContent = 'Create Show Folder';
    setStatus('Error.');
    showError(msg);
  };

  async function createShow() {
    if (!apiReady) return;
    const artist = $('artist').value.trim();
    const desc   = $('desc').value.trim();
    const year   = $('year').value.trim();
    const src    = $('src').value.trim();
    const dest   = $('dest').value.trim();

    const errs = [];
    if (!artist && !desc) errs.push('Artist / Client or Show Description is required.');
    if (!year)   errs.push('Year is required.');
    else if (!/^\d{4}$/.test(year)) errs.push('Year must be 4 digits.');
    if (!src)  errs.push('Template Folder is required.');
    if (!dest) errs.push('Active Show Directory is required.');

    const makeShortcut = $('shortcut').checked;
    const shortcutDir  = $('shortcut_dir').value.trim();
    if (makeShortcut && !shortcutDir) errs.push('Shortcut Folder is required when "Create show shortcut" is on.');
    if (errs.length) { showError(errs.join('\n')); return; }

    // Validate folders exist
    const checks = [api().check_path(src), api().check_path(dest)];
    if (makeShortcut) checks.push(api().check_path(shortcutDir));
    const results = await Promise.all(checks);
    const srcOk = results[0], destOk = results[1];
    const scOk  = makeShortcut ? results[2] : true;
    $('src').classList.toggle('invalid', !srcOk);
    $('dest').classList.toggle('invalid', !destOk);
    $('shortcut_dir').classList.toggle('invalid', makeShortcut && !scOk);
    if (!srcOk || !destOk || !scOk) {
      showError((!srcOk ? 'Template Folder does not exist.\n' : '') +
                (!destOk ? 'Active Show Directory does not exist.\n' : '') +
                (makeShortcut && !scOk ? 'Shortcut Folder does not exist.' : ''));
      return;
    }

    const name = showName();

    // Exact + fuzzy duplicate handling
    const exists = await api().show_exists(dest, name);
    if (exists) { showError(`A show folder named "${name}" already exists.\n\nOperation aborted.`); return; }

    if (similarResults.length) {
      const choice = await showSimilarConfirm(name);
      if (choice === 'abort') { setStatus('Aborted by user.'); return; }
      if (choice !== 'continue') {
        showError(`Files will NOT be copied.\n\nYou chose to use the existing folder:\n"${choice}"\n\nPlease manage files there manually.`);
        return;
      }
    }

    $('run').disabled = true;
    $('run').textContent = 'Creating…';
    setProgress(0);
    setStatus('Starting…');
    // Fire and forget — Python pushes progress + completion via window.on* callbacks
    api().create_show(artist, desc, year, src, dest, makeShortcut, shortcutDir);
  }

  // ── Overlay dialogs ─────────────────────────
  function closeOverlay() { $('overlay').classList.remove('show'); }

  function showError(msg) {
    $('dialog').innerHTML =
      `<div class="err-title">Cannot Continue</div>` +
      `<div class="err-body"></div>` +
      `<button class="btn-primary" style="width:auto;padding:0 28px" onclick="closeOverlay()">OK</button>`;
    $('dialog').querySelector('.err-body').textContent = msg;
    $('overlay').classList.add('show');
  }

  function showSuccess(name, destShow, count, renamed, shortcutNote) {
    const note = shortcutNote
      ? `<div class="counts" style="margin-top:-10px">${shortcutNote}</div>` : '';
    $('dialog').innerHTML =
      `<div class="check">✓</div>` +
      `<div class="dname"></div>` +
      `<div class="created">Created</div>` +
      `<div class="counts">${count} files copied · ${renamed} item(s) renamed</div>` +
      note +
      `<button class="btn-primary" style="width:auto;padding:0 24px" id="openClose">Open Folder &amp; Close</button>`;
    $('dialog').querySelector('.dname').textContent = `"${name}"`;
    $('openClose').onclick = () => api().open_and_quit(destShow);
    $('overlay').classList.add('show');
  }

  // Returns a promise resolving to 'continue' | 'abort' | <folder name>
  function showSimilarConfirm(name) {
    return new Promise((resolve) => {
      let rows = similarResults.map(([f, s]) => {
        const pct = Math.round(s * 100);
        const c = colorFor(pct);
        return `<div class="simrow" style="cursor:pointer" data-folder="${encodeURIComponent(f)}">
                  <span class="dot" style="color:${c}">●</span>
                  <span class="name"></span>
                  <span class="pct" style="color:${c}">${pct}%</span>
                </div>`;
      }).join('');
      $('dialog').innerHTML =
        `<div class="err-title" style="color:var(--accent)">Similar Shows Detected</div>` +
        `<div style="font-size:12px;color:var(--dim);margin-bottom:10px">Did you mean one of these? Click to use an existing folder.</div>` +
        `<div style="max-height:170px;overflow:auto;text-align:left;border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin-bottom:16px">${rows}</div>` +
        `<div style="display:flex;gap:8px;justify-content:center">` +
          `<button class="btn-small" style="height:36px" id="dlgAbort">Abort</button>` +
          `<button class="btn-primary" style="width:auto;padding:0 18px" id="dlgContinue">Create New Anyway</button>` +
        `</div>`;
      // fill names safely
      const nodes = $('dialog').querySelectorAll('.simrow');
      nodes.forEach((node, i) => {
        node.querySelector('.name').textContent = similarResults[i][0];
        node.onclick = () => { closeOverlay(); resolve(similarResults[i][0]); };
      });
      $('dlgAbort').onclick    = () => { closeOverlay(); resolve('abort'); };
      $('dlgContinue').onclick = () => { closeOverlay(); resolve('continue'); };
      $('overlay').classList.add('show');
    });
  }
</script>

</body>
